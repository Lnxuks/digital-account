# 数字账户 · nginx 站点配置
# 适用于 Debian 13 (trixie)
#
# ⚠️ 注意：TCP 端口最大为 65535，原需求的 221117 无法使用。
#    下面以 22117 为示例，请按需修改 listen 行。

server {
    listen 22117;
    listen [::]:22117;
    server_name _;

    root /var/www/digital-account;
    index index.html;

    # 静态资源缓存
    location ~* \.(css|js|svg|png|jpg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # HTML 不缓存，保证更新立即生效
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    charset utf-8;
}
