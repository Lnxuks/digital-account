# AccountHub HTTPS 反代示例（Nginx）
# 用法：
#   1. 把 account.example.com 换成你的域名
#   2. sudo cp docs/nginx-example.conf /etc/nginx/sites-available/account-hub
#      sudo ln -s /etc/nginx/sites-available/account-hub /etc/nginx/sites-enabled/
#      sudo certbot --nginx -d account.example.com
#      sudo nginx -t && sudo systemctl reload nginx
#   3. 服务改为只听本机（更安全）：sudo HOST=127.0.0.1 BEHIND_PROXY=1 bash install.sh

server {
    listen 80;
    listen [::]:80;
    server_name account.example.com;

    # certbot 接管 /.well-known/acme-challenge/ 后，其余请求跳 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name account.example.com;

    # 由 certbot 自动生成并维护
    ssl_certificate     /etc/letsencrypt/live/account.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/account.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;

    client_max_body_size 2m;   # 与后端请求体上限一致

    location / {
        proxy_pass http://127.0.0.1:21117;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
